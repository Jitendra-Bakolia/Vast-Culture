# ==============================================================================
# Vast Culture — Multi-Server Architecture Orchestration (Docker Compose)
# ==============================================================================
# Architecture ready for:
#   1. Frontend Client (Active)
#   2. Multi-Service Backend APIs (Auth, Catalog, Checkout, Payments)
#   3. Databases (PostgreSQL, MongoDB, Redis Cache)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. CLIENT / FRONTEND WEB APPLICATION (Active)
  # High-performance Nginx production web server serving the React SPA
  # ----------------------------------------------------------------------------
  client:
    container_name: vast-culture-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${CLIENT_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - vast-culture-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

