# ==============================================================================
# Vast Culture — Production Multi-Server Architecture (Docker Compose)
# ==============================================================================
# Services:
#   1. client: Production Nginx serving React SPA (Port 3000)
#   2. server: Core REST API Server (Port 5000)
#   3. socket-server: Socket.IO & Redis Server (Port 7000)
#   4. calling-server: Real-time Media & WebSocket Server (Port 8000)
#   5. job-server: BullMQ Background Worker Server (Port 9000)
#   6. mysql: MySQL 8.0 Relational Database (Internal: 3306, Host: 3307)
#   7. redis: Redis 7 In-Memory Cache & Socket Broker (Internal: 6379, Host: 6380)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASES & BROKERS
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: vast-culture-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-vastculture}
      MYSQL_USER: ${MYSQL_USER:-vastadmin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-vastadmin} -p${MYSQL_PASSWORD:-secret} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vast-culture-network

  redis:
    image: redis:7-alpine
    container_name: vast-culture-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vast-culture-network

  # ----------------------------------------------------------------------------
  # 2. BACKEND MICROSERVICES
  # ----------------------------------------------------------------------------
  server:
    container_name: vast-culture-server
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - TIMEZONE=${TIMEZONE:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - DB_NAME=${DB_NAME:-vastculture}
      - MYSQL_USER=${MYSQL_USER:-vastadmin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_LOGGING=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vast-culture-network

  socket-server:
    container_name: vast-culture-socket-server
    build:
      context: .
      dockerfile: socket-server/Dockerfile
    ports:
      - "${SOCKET_PORT:-7000}:7000"
    environment:
      - NODE_ENV=production
      - PORT=7000
      - TIMEZONE=${TIMEZONE:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - DB_NAME=${DB_NAME:-vastculture}
      - MYSQL_USER=${MYSQL_USER:-vastadmin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vast-culture-network

  job-server:
    container_name: vast-culture-job-server
    build:
      context: .
      dockerfile: job-server/Dockerfile
    ports:
      - "${JOB_PORT:-9000}:9000"
    environment:
      - NODE_ENV=production
      - PORT=9000
      - TIMEZONE=${TIMEZONE:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - DB_NAME=${DB_NAME:-vastculture}
      - MYSQL_USER=${MYSQL_USER:-vastadmin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vast-culture-network

  calling-server:
    container_name: vast-culture-calling-server
    build:
      context: .
      dockerfile: calling-server/Dockerfile
    ports:
      - "${CALLING_PORT:-8000}:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - TIMEZONE=${TIMEZONE:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - DB_NAME=${DB_NAME:-vastculture}
      - MYSQL_USER=${MYSQL_USER:-vastadmin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vast-culture-network

  # ----------------------------------------------------------------------------
  # 3. CLIENT / FRONTEND WEB APPLICATION
  # ----------------------------------------------------------------------------
  client:
    container_name: vast-culture-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${CLIENT_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - vast-culture-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ------------------------------------------------------------------------------
# NETWORKS
# ------------------------------------------------------------------------------
networks:
  vast-culture-network:
    name: vast-culture-network
    driver: bridge

# ------------------------------------------------------------------------------
# VOLUMES
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
  redis_data:
