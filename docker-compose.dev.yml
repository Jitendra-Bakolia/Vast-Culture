# ==============================================================================
# Vast Culture — Development Orchestration with HMR, Services & Live Reload
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASES & BROKERS
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: vast-culture-mysql-dev
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-vastculture}
      MYSQL_USER: ${MYSQL_USER:-vastadmin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-vastadmin} -p${MYSQL_PASSWORD:-secret} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vast-culture-network

  redis:
    image: redis:7-alpine
    container_name: vast-culture-redis-dev
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vast-culture-network

  # ----------------------------------------------------------------------------
  # 2. BACKEND SERVICES (Dev Mode with Live Code Mounts)
  # ----------------------------------------------------------------------------
  server:
    container_name: vast-culture-server-dev
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    ports:
      - "${SERVER_PORT:-5000}:5000"
    working_dir: /app/server
    volumes:
      - ./server:/app/server
      - ./resources:/app/resources
      - /app/server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - TIMEZONE=${TIMEZONE:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - DB_NAME=${DB_NAME:-vastculture}
      - MYSQL_USER=${MYSQL_USER:-vastadmin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_LOGGING=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vast-culture-network

  socket-server:
    container_name: vast-culture-socket-server-dev
    build:
      context: .
      dockerfile: socket-server/Dockerfile.dev
    ports:
      - "${SOCKET_PORT:-7000}:7000"
    working_dir: /app/socket-server
    volumes:
      - ./socket-server:/app/socket-server
      - ./resources:/app/resources
      - /app/socket-server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=7000
      - TIMEZONE=${TIMEZONE:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - DB_NAME=${DB_NAME:-vastculture}
      - MYSQL_USER=${MYSQL_USER:-vastadmin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vast-culture-network

  job-server:
    container_name: vast-culture-job-server-dev
    build:
      context: .
      dockerfile: job-server/Dockerfile.dev
    ports:
      - "${JOB_PORT:-9000}:9000"
    working_dir: /app/job-server
    volumes:
      - ./job-server:/app/job-server
      - ./resources:/app/resources
      - /app/job-server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=9000
      - TIMEZONE=${TIMEZONE:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - DB_NAME=${DB_NAME:-vastculture}
      - MYSQL_USER=${MYSQL_USER:-vastadmin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vast-culture-network

  calling-server:
    container_name: vast-culture-calling-server-dev
    build:
      context: .
      dockerfile: calling-server/Dockerfile.dev
    ports:
      - "${CALLING_PORT:-8000}:8000"
    working_dir: /app/calling-server
    volumes:
      - ./calling-server:/app/calling-server
      - ./resources:/app/resources
      - /app/calling-server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=8000
      - TIMEZONE=${TIMEZONE:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - DB_NAME=${DB_NAME:-vastculture}
      - MYSQL_USER=${MYSQL_USER:-vastadmin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vast-culture-network

  # ----------------------------------------------------------------------------
  # 3. CLIENT APPLICATION & TUNNEL
  # ----------------------------------------------------------------------------
  client:
    container_name: vast-culture-client-dev
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
    restart: unless-stopped
    networks:
      - vast-culture-network

  ngrok:
    container_name: vast-culture-ngrok-dev
    image: ngrok/ngrok:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$NGROK_DOMAIN" ]; then
          TARGET_URL=$$(echo "$$NGROK_DOMAIN" | sed 's~^https\?://~~')
          echo "Starting ngrok with permanent static domain: https://$${TARGET_URL}"
          exec ngrok --config=/var/lib/ngrok/ngrok.yml http client:3000 --url="https://$${TARGET_URL}" --log=stdout --log-format=logfmt
        else
          echo "Starting ngrok with dynamic random domain"
          exec ngrok --config=/var/lib/ngrok/ngrok.yml http client:3000 --log=stdout --log-format=logfmt
        fi
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-2S3ER37dEVIkIX99wU8bt29CXDS_44tLxwfiYBduQKMWpthDY}
      - NGROK_DOMAIN=${NGROK_DOMAIN:-georgene-fameless-subflexuously.ngrok-free.dev}
    ports:
      - "${NGROK_WEB_PORT:-4041}:4040"
    depends_on:
      - client
    networks:
      - vast-culture-network

  ngrok-url:
    container_name: vast-culture-ngrok-url
    image: node:22-alpine
    restart: on-failure
    depends_on:
      - ngrok
    networks:
      - vast-culture-network
    environment:
      - NGROK_WEB_PORT=${NGROK_WEB_PORT:-4041}
    command:
      - "node"
      - "-e"
      - |
        async function reportTunnel() {
          console.log('⏳ Waiting for ngrok tunnel initialization...');
          for (let attempt = 1; attempt <= 45; attempt++) {
            try {
              const res = await fetch('http://ngrok:4040/api/tunnels');
              if (res.ok) {
                const data = await res.json();
                const tunnel = data.tunnels && data.tunnels[0];
                if (tunnel && tunnel.public_url) {
                  const inspectorPort = process.env.NGROK_WEB_PORT || '4041';
                  console.log('\n' + '='.repeat(70));
                  console.log('  🚀 [VAST CULTURE DEVELOPMENT TUNNEL ACTIVE]');
                  console.log('  🌐 LIVE PUBLIC NGROK URL : ' + tunnel.public_url);
                  console.log('  📊 WEB INSPECTOR         : http://localhost:' + inspectorPort);
                  console.log('  🔌 FORWARDING TO         : ' + (tunnel.config?.addr || 'http://client:3000'));
                  console.log('='.repeat(70) + '\n');
                  return;
                }
              }
            } catch (err) {}
            await new Promise((r) => setTimeout(r, 1000));
          }
        }
        reportTunnel();

# ------------------------------------------------------------------------------
# NETWORKS & VOLUMES
# ------------------------------------------------------------------------------
networks:
  vast-culture-network:
    name: vast-culture-network-dev
    driver: bridge

volumes:
  mysql_dev_data:
  redis_dev_data:
